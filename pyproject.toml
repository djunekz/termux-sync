[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termux-sync"
version = "1.1.1"
description = "Backup and restore your entire Termux environment across devices"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "djunekz" }
]
keywords = ["termux", "backup", "restore", "android", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/djunekz/termux-sync"
Repository = "https://github.com/djunekz/termux-sync"
Changelog = "https://github.com/djunekz/termux-sync/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/djunekz/termux-sync/issues"

[project.scripts]
termux-sync = "termux_sync:main"

[tool.hatch.build.targets.wheel]
packages = ["src/termux_sync"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]
