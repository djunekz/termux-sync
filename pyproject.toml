[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termux-sync"
version = "1.3.0"
description = "Backup and restore your entire Termux environment across devices"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "djunekz" }
]
keywords = ["termux", "backup", "restore", "android", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/djunekz/termux-sync"
Repository = "https://github.com/djunekz/termux-sync"
Changelog = "https://github.com/djunekz/termux-sync/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/djunekz/termux-sync/issues"

[project.scripts]
termux-sync = "termux_sync:main"

[tool.hatch.build.targets.wheel]
packages = ["src/termux_sync"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["termux_sync"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["termux-sync.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702", "E741"]

[tool.mypy]
python_version = "3.10"
files = ["src/termux_sync"]
ignore_missing_imports = true
warn_unused_ignores = true
