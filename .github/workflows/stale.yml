name: Stale

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale issues and PRs
    runs-on: ubuntu-latest

    steps:
      - name: Run stale action
        uses: actions/stale@v11
        with:
          stale-issue-message: >
            This issue has been open for 30 days with no activity.
            It will be closed in 7 days unless there is further discussion.
            If this is still relevant, please leave a comment or update the issue.

          stale-pr-message: >
            This pull request has been open for 30 days with no activity.
            It will be closed in 7 days unless there is further activity.
            If you are still working on this, please leave a comment.

          close-issue-message: >
            This issue was closed due to inactivity. Feel free to reopen it
            if the problem is still present or the request is still relevant.

          close-pr-message: >
            This pull request was closed due to inactivity. Feel free to reopen
            it if you would like to continue working on this change.

          days-before-stale: 30
          days-before-close: 7

          stale-issue-label: stale
          stale-pr-label: stale

          exempt-issue-labels: "pinned,security,in-progress"
          exempt-pr-labels: "pinned,security,in-progress"

          operations-per-run: 100
