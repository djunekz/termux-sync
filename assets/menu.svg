<svg xmlns="http://www.w3.org/2000/svg" width="720" height="974" viewBox="0 0 720 974" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">termux-sync command menu</title>
  <desc id="desc">Terminal window showing the termux-sync help screen with every command, option and example</desc>
  <rect width="720" height="974" rx="14" fill="#0f172a"/>
  <rect width="720" height="40" rx="14" fill="#1e293b"/>
  <rect y="26" width="720" height="14" fill="#1e293b"/>
  <circle cx="26" cy="20" r="6" fill="#ef4444"/>
  <circle cx="48" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="20" r="6" fill="#22c55e"/>
  <text x="360" y="25" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#94a3b8">termux-sync</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
    <text x="24" y="72" fill="#94a3b8">$</text>
    <text x="41" y="72" fill="#e2e8f0">termux-sync help</text>
    <text x="24" y="102" fill="#e2e8f0" font-weight="bold">Usage:</text>
    <text x="82" y="102" fill="#22d3ee">termux-sync</text>
    <text x="182" y="102" fill="#94a3b8">&lt;command&gt; [options]</text>
    <text x="24" y="134" fill="#facc15" font-weight="bold">Backup &amp; Restore</text>
    <text x="40" y="156" fill="#22d3ee">backup</text>
    <text x="170" y="156" fill="#cbd5e1">Create a new backup</text>
    <text x="40" y="178" fill="#22d3ee">restore</text>
    <text x="170" y="178" fill="#cbd5e1">Restore from a backup</text>
    <text x="40" y="200" fill="#22d3ee">list</text>
    <text x="170" y="200" fill="#cbd5e1">List all available backups</text>
    <text x="40" y="222" fill="#22d3ee">delete</text>
    <text x="170" y="222" fill="#cbd5e1">Delete a specific backup</text>
    <text x="24" y="254" fill="#facc15" font-weight="bold">Configuration</text>
    <text x="40" y="276" fill="#22d3ee">setup</text>
    <text x="170" y="276" fill="#cbd5e1">Interactive configuration wizard</text>
    <text x="40" y="298" fill="#22d3ee">schedule</text>
    <text x="170" y="298" fill="#cbd5e1">Configure auto-backup schedule</text>
    <text x="40" y="320" fill="#22d3ee">daemon</text>
    <text x="170" y="320" fill="#cbd5e1">Run background scheduler (used by Termux:Boot)</text>
    <text x="40" y="342" fill="#22d3ee">export-config</text>
    <text x="170" y="342" fill="#cbd5e1">Export config to a file (tokens redacted)</text>
    <text x="40" y="364" fill="#22d3ee">import-config</text>
    <text x="170" y="364" fill="#cbd5e1">Import config from a file</text>
    <text x="24" y="396" fill="#facc15" font-weight="bold">Maintenance</text>
    <text x="40" y="418" fill="#22d3ee">status</text>
    <text x="170" y="418" fill="#cbd5e1">Show current config and environment</text>
    <text x="40" y="440" fill="#22d3ee">logs</text>
    <text x="170" y="440" fill="#cbd5e1">Show recent log entries</text>
    <text x="40" y="462" fill="#22d3ee">clear-logs</text>
    <text x="170" y="462" fill="#cbd5e1">Clear / reset the log file</text>
    <text x="40" y="484" fill="#22d3ee">check</text>
    <text x="170" y="484" fill="#cbd5e1">Show disk usage (~, $PREFIX, or a custom path)</text>
    <text x="40" y="506" fill="#22d3ee">clear-cache</text>
    <text x="170" y="506" fill="#cbd5e1">Remove temporary and cached files</text>
    <text x="40" y="528" fill="#22d3ee">help</text>
    <text x="170" y="528" fill="#cbd5e1">Show this help</text>
    <text x="24" y="560" fill="#facc15" font-weight="bold">Options</text>
    <text x="40" y="582" fill="#4ade80">-l, --label LABEL</text>
    <text x="214" y="582" fill="#cbd5e1">Label for this backup</text>
    <text x="40" y="604" fill="#4ade80">-n, --name NAME</text>
    <text x="214" y="604" fill="#cbd5e1">Backup name to restore / delete</text>
    <text x="40" y="626" fill="#4ade80">--lines N</text>
    <text x="214" y="626" fill="#cbd5e1">Lines to show in logs (default 40)</text>
    <text x="40" y="648" fill="#4ade80">--debug</text>
    <text x="214" y="648" fill="#cbd5e1">Show the full traceback if something fails</text>
    <text x="40" y="670" fill="#4ade80">-v, --version</text>
    <text x="214" y="670" fill="#cbd5e1">Print version and exit</text>
    <text x="40" y="692" fill="#4ade80">-h, --help</text>
    <text x="214" y="692" fill="#cbd5e1">Show this help</text>
    <text x="24" y="724" fill="#facc15" font-weight="bold">Examples</text>
    <text x="40" y="746" fill="#94a3b8">$</text>
    <text x="57" y="746" fill="#e2e8f0">termux-sync setup</text>
    <text x="404" y="746" fill="#64748b">first-time configuration</text>
    <text x="40" y="768" fill="#94a3b8">$</text>
    <text x="57" y="768" fill="#e2e8f0">termux-sync backup --label before-new-phone</text>
    <text x="404" y="768" fill="#64748b">create a labelled backup</text>
    <text x="40" y="790" fill="#94a3b8">$</text>
    <text x="57" y="790" fill="#e2e8f0">termux-sync list</text>
    <text x="404" y="790" fill="#64748b">see all backups</text>
    <text x="40" y="812" fill="#94a3b8">$</text>
    <text x="57" y="812" fill="#e2e8f0">termux-sync restore</text>
    <text x="404" y="812" fill="#64748b">pick a backup to restore</text>
    <text x="40" y="834" fill="#94a3b8">$</text>
    <text x="57" y="834" fill="#e2e8f0">termux-sync delete --name &lt;backup-name&gt;</text>
    <text x="404" y="834" fill="#64748b">delete a specific backup</text>
    <text x="40" y="856" fill="#94a3b8">$</text>
    <text x="57" y="856" fill="#e2e8f0">termux-sync logs --lines 100</text>
    <text x="404" y="856" fill="#64748b">show the last 100 log lines</text>
    <text x="40" y="878" fill="#94a3b8">$</text>
    <text x="57" y="878" fill="#e2e8f0">termux-sync check ~</text>
    <text x="404" y="878" fill="#64748b">disk usage of your home</text>
    <text x="40" y="900" fill="#94a3b8">$</text>
    <text x="57" y="900" fill="#e2e8f0">termux-sync import-config &lt;file&gt;</text>
    <text x="404" y="900" fill="#64748b">load a config file</text>
    <line x1="24" y1="924" x2="696" y2="924" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="950" fill="#4ade80" font-size="18" font-weight="bold">termux<tspan fill="#f8fafc">-sync</tspan> <tspan fill="#94a3b8" font-weight="normal" font-size="14">Backup and restore your Termux environment</tspan></text>
  </g>
</svg>
